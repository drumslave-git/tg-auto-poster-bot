services:
  app:
    build: .
    image: ${IMAGE:-tg-auto-poster-bot}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # V8 sizes its heap from the *host's* memory unless told otherwise, which
      # is what makes an idle container look like it is holding on to gigabytes.
      # This app's own working set is a few MB; the rest of the allowance below
      # is there for yt-dlp and ffmpeg, which run as separate processes.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      # Shared secret for every /api call. Leave empty only on a private host.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      # Bootstrap values, used only the first time the database is created —
      # everything below is managed from the dashboard afterwards.
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_IDS: ${ADMIN_IDS:-}
      MANAGER_IDS: ${MANAGER_IDS:-}
      TZ_NAME: ${TZ_NAME:-UTC}
      TZ: ${TZ:-UTC}
    volumes:
      # The database lives at /app/data/app.db and the watermark PNG beside it
      # at /app/data/watermark.png; bind-mounting the directory is what makes
      # both survive a redeploy. The container runs as a non-root user, so this
      # path must be writable by it.
      - "${DATA_DIR:-./data}:/app/data"
    # A hard ceiling for the whole container — the server *and* the yt-dlp and
    # ffmpeg it spawns. Merging a downloaded 50 MB video is cheap; the real peak
    # is watermarking, which re-encodes a 1080p video with x264 rather than just
    # muxing it, so 768M is the figure to start from with that switched on. The
    # kernel OOM-kills the container if this is too low — and a reaped encode is
    # exactly how a post ends up a black rectangle — so lower it only if you
    # have watched it hold.
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-768M}
          cpus: ${CPU_LIMIT:-2}
    healthcheck:
      # 127.0.0.1 (not localhost): the server binds IPv4, and localhost can
      # resolve to IPv6 ::1 inside the container, which would refuse-connect.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
